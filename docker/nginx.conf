# Static server for the CultureMap map (style, TileJSON, vector tiles, glyphs, sprites).
# Data root: /srv/map (the repo mounted read-only, or a staged subset baked in by the `subset` target).
#
# The style JSONs and berlin/metadata.json contain absolute production/dev hosts. They are rewritten
# per request to the host the client used (scheme://Host header), so the same container works on any
# loopback port (fixed -p mapping or a random Testcontainers port) without touching the source files.

server {
    listen 80 default_server;
    server_name _;
    root /srv/map;

    access_log off;
    gzip off;            # tiles on disk are raw protobuf; no Content-Encoding is sent
    etag off;            # rewritten JSON depends on Host; keep caching out of tests
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;

    location = /health { default_type text/plain; return 200 "ok\n"; }

    # Style and TileJSON: rewrite the hosts baked into the files.
    location ~ ^/(culturemap\.json|culturemap-local\.json|berlin/metadata\.json)$ {
        default_type application/json;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter "https://map.bzl.hs-example.de" "$scheme://$http_host";
        sub_filter "http://culturemapmap.eu.ngrok.io" "$scheme://$http_host";
        try_files $uri =404;
    }
    # Convenience alias: /style.json == production style.
    location = /style.json {
        default_type application/json;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter "https://map.bzl.hs-example.de" "$scheme://$http_host";
        sub_filter "http://culturemapmap.eu.ngrok.io" "$scheme://$http_host";
        try_files /culturemap.json =404;
    }

    # Vector tiles. Outside a staged subset: 204 (MapLibre treats it as an empty tile, no console error).
    location /berlin/ {
        types { } default_type application/x-protobuf;
        try_files $uri =204;
    }

    location /fonts/  { types { } default_type application/x-protobuf; try_files $uri =404; }
    location /sprites/ { try_files $uri =404; }

    # Nothing else from the map repo (data/, config/, log, .git) is served.
    location / { return 404; }
}
